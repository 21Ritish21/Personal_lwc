<template>
    <lightning-card title="Contact Form">
        <div class="slds-var-p-around_medium">
            <lightning-input
                type="text"
                label="Name"
                name="name"
                value={contact.name}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="number"
                label="Mobile"
                name="mobile"
                value={contact.mobile}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="text"
                label="Email"
                name="email"
                value={contact.email}
                onchange={handleChange}>
            </lightning-input>

            <lightning-combobox
                label="Gender"
                name="gender"
                value={contact.gender}
                options={genderOptions}
                placeholder="Select gender"
                onchange={handleChange}>
            </lightning-combobox>

            <lightning-input
                type="checkbox"
                label="Available to contact"
                name="available"
                checked={contact.available}
                onchange={handleChange}>
            </lightning-input>

            <lightning-button
                label="Submit"
                variant="brand"
                onclick={handleSubmit}>
            </lightning-button>

            <template lwc:if={isSubmitted}>
                <div class="message">{message}</div>
            </template>
            <p lwc:else>Please fill the form and click Submit.</p>
        </div>
    </lightning-card>
</template>
