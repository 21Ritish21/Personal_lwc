<template>
    <lightning-card title="Form">
        <div class="slds-var-p-around_medium">
            <lightning-input type="number" label="ID" name="id" value={emp.id} onchange={handleInput}></lightning-input>
            <lightning-input type="text" label="Name" name="name" value={emp.name} onchange={handleInput}></lightning-input>
            <lightning-input type="number" label="Salary" name="salary" value={emp.salary} onchange={handleInput}></lightning-input>

            <lightning-button label="Add Employee" variant="brand" onclick={addEmployee}></lightning-button>
        </div>
    </lightning-card>
</template>
