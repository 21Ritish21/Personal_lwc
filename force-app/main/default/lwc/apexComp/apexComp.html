<template>
    <lightning-card title="Create, Update, Delete Account">
        <div class="slds-var-p-around_medium">
            <lightning-input label="Record Id" name="id" value={account.id} onchange={handleInput}></lightning-input>
            <lightning-input label="Account Name" name="name" value={account.name} onchange={handleInput}></lightning-input>
            <lightning-input label="Account Number" name="number" value={account.number} onchange={handleInput}></lightning-input>

            <lightning-button label="Save" variant="brand" onclick={addAccount}></lightning-button>
            <lightning-button label="Update" variant="success" onclick={updateAcc}></lightning-button>
            <lightning-button label="Delete" variant="destructive" onclick={deleteAcc}></lightning-button>
        </div>
    </lightning-card>
</template>
