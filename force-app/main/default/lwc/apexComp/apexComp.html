<template>
    <lightning-card title="Search Accounts">
        <div class="slds-var-p-around_medium">
            <lightning-input label="Account name" onchange={handleChange}></lightning-input>
            <lightning-button label="Search" variant="brand" onclick={getAccounts}></lightning-button>

            <ul>
                <template for:each={accounts} for:item="acc">
                    <li key={acc.Id}>{acc.Name} - {acc.Phone}</li>
                </template>
            </ul>
        </div>
    </lightning-card>
</template>
