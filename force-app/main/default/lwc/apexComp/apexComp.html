<template>
    <lightning-card title="Create Account">
        <div class="slds-var-p-around_medium">
            <lightning-input label="Account Name" name="name" onchange={handleInput}></lightning-input>

            <template lwc:if={errName}>
                <p class="slds-text-color_error">{errName}</p>
            </template>

            <lightning-input label="Account Number" name="number" onchange={handleInput}></lightning-input>

            <lightning-button label="Save" variant="brand" onclick={addAccount}></lightning-button>
        </div>
    </lightning-card>
</template>
