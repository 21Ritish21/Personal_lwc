<template>
    <lightning-card title="Employee List">
        <div class="slds-var-p-around_medium">
            <ul>
                <template for:each={employees} for:item="emp">
                    <li key={emp.id} class="style1">
                        {emp.id} - {emp.name} - Salary: {emp.salary}
                    </li>
                </template>
            </ul>
        </div>
    </lightning-card>
</template>
