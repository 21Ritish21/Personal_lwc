<template>
    <lightning-card title="Employee Form">
        <div class="slds-var-p-around_medium">
            <lightning-input
                label="ID"
                name="id"
                value={emp.id}
                onchange={handleInput}>
            </lightning-input>

            <lightning-input
                label="Name"
                name="name"
                value={emp.name}
                onchange={handleInput}>
            </lightning-input>

            <lightning-input
                type="number"
                label="Salary"
                name="salary"
                value={emp.salary}
                onchange={handleInput}>
            </lightning-input>

            <lightning-button
                label="Change User Name"
                variant="success"
                onclick={changeName}>
            </lightning-button>

            <div class="style1">
                <p>ID: {emp.id}</p>
                <p>Name: {emp.name}</p>
                <p>Salary: {emp.salary}</p>
            </div>
        </div>
    </lightning-card>
</template>
